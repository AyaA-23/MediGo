{% load i18n_patient_tags %}
{% get_lang as lang %}
{% get_dir as dir %}
<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medigo — {% t "consultation_finished" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --navy: #1a2a4a; --cyan: #00bcd4; --green: #43a047; --bg: #f0f4f8; --text-muted: #7a8caa; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: {% if lang == 'ar' %}'Cairo'{% else %}'Plus Jakarta Sans'{% endif %}, sans-serif;
            background: linear-gradient(160deg, var(--navy) 0%, #1e3a6e 50%, #0d47a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .done-card {
            background: white;
            border-radius: 28px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0,0,0,0.3);
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .done-icon {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(67,160,71,0.15), rgba(0,188,212,0.1));
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 2rem;
        }
        .done-icon i {
            font-size: 2.5rem;
            color: var(--green);
            animation: checkPop 0.6s ease 0.3s both;
        }
        @keyframes checkPop {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .done-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 0.75rem;
        }
        .done-sub {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .done-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--navy), #1e3a6e);
            color: white;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .done-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,42,74,0.35); }
        .done-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .done-divider::before, .done-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .done-tip {
            background: var(--bg);
            border-radius: 12px;
            padding: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="done-card">
        <div class="done-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <div class="done-title">{% t "consultation_finished" %}</div>
        <div class="done-sub">{% t "thanks_medigo" %}<br>{% t "take_care" %}</div>
        <a href="{% url 'patient_menu' %}" class="done-btn">
            <i class="fa-solid fa-house"></i> {% t "back_home" %}
        </a>
        <div class="done-divider">{% t "get_well" %}</div>
        <div class="done-tip">
            <i class="fa-solid fa-lightbulb" style="color:var(--cyan);margin-{% if dir == 'rtl' %}left{% else %}right{% endif %}:0.4rem;"></i>
            {% t "reconsult_advice" %}
        </div>
    </div>
</body>
</html>
