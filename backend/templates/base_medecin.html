<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Medigo{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --navy: #1a2a4a;
            --navy-light: #243555;
            --cyan: #00bcd4;
            --cyan-light: #4dd0e1;
            --blue: #1976d2;
            --blue-light: #e3f2fd;
            --green: #43a047;
            --green-light: #e8f5e9;
            --orange: #fb8c00;
            --orange-light: #fff3e0;
            --red: #e53935;
            --red-light: #ffebee;
            --teal: #00897b;
            --bg: #f0f4f8;
            --white: #ffffff;
            --text: #1a2a4a;
            --text-muted: #7a8caa;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(26,42,74,0.08);
            --shadow-lg: 0 8px 40px rgba(26,42,74,0.14);
            --radius: 14px;
            --radius-sm: 8px;
            --sidebar-width: 260px;
            --header-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--navy);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0; bottom: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sidebar-logo {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            height: var(--header-height);
        }

        .sidebar-logo img {
            height: 44px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        .sidebar-nav {
            flex: 1;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.875rem 1rem;
            border-radius: var(--radius-sm);
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.925rem;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.08);
            color: white;
            transform: translateX(3px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(0,188,212,0.2), rgba(25,118,210,0.2));
            color: var(--cyan-light);
            border-left: 3px solid var(--cyan);
        }

        .nav-item i { width: 20px; text-align: center; font-size: 1rem; }

        .sidebar-bottom {
            padding: 1rem;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.875rem 1.25rem;
            background: var(--navy-light);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.925rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-logout:hover { background: var(--red); transform: translateY(-1px); }

        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            height: var(--header-height);
            background: var(--white);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 12px rgba(26,42,74,0.06);
        }

        .search-bar { flex: 1; max-width: 500px; position: relative; }

        .search-bar input {
            width: 100%;
            padding: 0.625rem 1rem 0.625rem 2.75rem;
            border: 1.5px solid var(--border);
            border-radius: 50px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            color: var(--text);
            background: var(--bg);
            transition: all 0.2s ease;
            outline: none;
        }

        .search-bar input:focus {
            border-color: var(--cyan);
            background: white;
            box-shadow: 0 0 0 3px rgba(0,188,212,0.1);
        }

        .search-bar i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .header-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }

        .header-avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 0.85rem;
        }

        .page-content { flex: 1; padding: 2rem; animation: fadeInUp 0.4s ease; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            border: 1px solid var(--border);
            transition: box-shadow 0.2s ease;
        }

        .card:hover { box-shadow: var(--shadow-lg); }
        .card-title { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 1.25rem; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: 50px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: var(--blue); color: white; }
        .btn-primary:hover { background: #1565c0; box-shadow: 0 4px 12px rgba(25,118,210,0.35); }
        .btn-success { background: var(--green); color: white; }
        .btn-success:hover { background: #388e3c; box-shadow: 0 4px 12px rgba(67,160,71,0.35); }
        .btn-danger { background: var(--red); color: white; }
        .btn-danger:hover { background: #c62828; box-shadow: 0 4px 12px rgba(229,57,53,0.35); }
        .btn-warning { background: var(--orange); color: white; }
        .btn-warning:hover { background: #ef6c00; box-shadow: 0 4px 12px rgba(251,140,0,0.35); }
        .btn-outline { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
        .btn-outline:hover { background: var(--blue-light); }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.3rem 0.75rem;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .badge-success { background: var(--green-light); color: var(--green); }
        .badge-warning { background: var(--orange-light); color: var(--orange); }
        .badge-danger { background: var(--red-light); color: var(--red); }
        .badge-info { background: var(--blue-light); color: var(--blue); }

        .table-container { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }

        table { width: 100%; border-collapse: collapse; }

        thead tr { background: linear-gradient(135deg, #1976d2, #0097a7); }

        thead th {
            padding: 0.875rem 1.25rem;
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            text-align: left;
        }

        tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s ease; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--bg); }

        tbody td { padding: 0.875rem 1.25rem; font-size: 0.9rem; color: var(--text); }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--bg);
            border-radius: 50px;
            padding: 0.25rem;
            border: 1px solid var(--border);
        }

        .toggle-option {
            padding: 0.5rem 1.25rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            background: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .toggle-option.active-green { background: var(--green); color: white; box-shadow: 0 2px 8px rgba(67,160,71,0.4); }
        .toggle-option.active-red { background: var(--red); color: white; box-shadow: 0 2px 8px rgba(229,57,53,0.4); }

        .sensor-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: var(--bg);
            border-radius: var(--radius-sm);
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
        }

        .sensor-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--teal);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            background: var(--border);
            border-radius: 50px;
            padding: 0.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            gap: 0;
        }

        .switch-option { padding: 0.35rem 0.75rem; border-radius: 50px; font-size: 0.78rem; font-weight: 700; transition: all 0.3s ease; z-index: 1; }
        .switch.on { background: rgba(67,160,71,0.15); }
        .switch.on .switch-on { background: var(--green); color: white; box-shadow: 0 2px 6px rgba(67,160,71,0.4); }
        .switch.on .switch-off { color: var(--text-muted); }
        .switch.off { background: rgba(229,57,53,0.1); }
        .switch.off .switch-off { background: var(--red); color: white; box-shadow: 0 2px 6px rgba(229,57,53,0.35); }
        .switch.off .switch-on { color: var(--text-muted); }

        .spinner {
            width: 20px; height: 20px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            top: 1.5rem; right: 1.5rem;
            background: white;
            border-radius: var(--radius-sm);
            padding: 1rem 1.5rem;
            box-shadow: var(--shadow-lg);
            border-left: 4px solid var(--green);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 9999;
            animation: slideInRight 0.3s ease;
            min-width: 280px;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .alert-urgent {
            position: fixed;
            top: 1.5rem; right: 1.5rem;
            background: var(--red);
            color: white;
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            box-shadow: 0 8px 32px rgba(229,57,53,0.4);
            display: none;
            align-items: center;
            gap: 1rem;
            font-size: 1rem;
            font-weight: 600;
            z-index: 9999;
            animation: pulseAlert 1s ease infinite;
            min-width: 320px;
        }

        @keyframes pulseAlert {
            0%, 100% { box-shadow: 0 8px 32px rgba(229,57,53,0.4); }
            50% { box-shadow: 0 8px 48px rgba(229,57,53,0.7); }
        }

        .page-loader {
            position: fixed; inset: 0;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: loaderFade 0.5s ease 0.8s forwards;
        }

        .page-loader-inner { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }

        .page-loader img {
            height: 80px;
            filter: brightness(0) invert(1);
            animation: logoPulse 1s ease infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .loader-bar { width: 200px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 50px; overflow: hidden; }

        .loader-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--blue));
            border-radius: 50px;
            animation: loadBar 0.8s ease forwards;
        }

        @keyframes loadBar { from { width: 0%; } to { width: 100%; } }
        @keyframes loaderFade { to { opacity: 0; pointer-events: none; visibility: hidden; } }

        .django-messages { margin-bottom: 1rem; }

        .django-message {
            padding: 0.875rem 1.25rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            animation: fadeInUp 0.3s ease;
        }

        .django-message.success { background: var(--green-light); color: var(--green); border-left: 4px solid var(--green); }
        .django-message.error { background: var(--red-light); color: var(--red); border-left: 4px solid var(--red); }
        .django-message.warning { background: var(--orange-light); color: var(--orange); border-left: 4px solid var(--orange); }


        /* ===== RESPONSIVE ===== */
        .sidebar-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--navy);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }

        .sidebar-overlay.active {
            display: block;
        }

        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                z-index: 200;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-wrapper {
                margin-left: 0;
            }
            .sidebar-toggle {
                display: block;
            }
            .stat-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 0 1rem;
                height: 56px;
            }
            .page-content {
                padding: 1rem;
            }
            .search-bar {
                max-width: none;
            }
            .search-bar input {
                font-size: 0.85rem;
                padding: 0.5rem 0.75rem 0.5rem 2.25rem;
            }
            .stat-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
            }
            .vc-grid {
                grid-template-columns: 1fr;
            }
            .vc-header {
                flex-direction: column;
                text-align: center;
            }
            table {
                font-size: 0.8rem;
            }
            thead th, tbody td {
                padding: 0.625rem 0.75rem;
            }
            .mp-header {
                flex-direction: column;
                text-align: center;
                gap: 0.75rem;
            }
            .patient-card-inner {
                flex-direction: column;
                text-align: center;
            }
            .p-stats {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .stat-grid {
                grid-template-columns: 1fr;
            }
            .btn {
                font-size: 0.8rem;
                padding: 0.5rem 1rem;
            }
            .card {
                padding: 1rem;
            }
            .welcome-title {
                font-size: 1.3rem;
            }
            .p-info .p-badges {
                justify-content: center;
            }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

<!-- page loader supprimé — trop fréquent -->

<div class="sidebar">
    <div class="sidebar-logo">
        <img src="/static/images/logo.png" alt="Medigo">
    </div>
    <nav class="sidebar-nav">
        <a href="{% url 'medecin_dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'medecin_dashboard' %}active{% endif %}">
            <i class="fa-solid fa-table-columns"></i>
            Tableau de bord
        </a>
        <a href="{% url 'medecin_consultations' %}" class="nav-item {% if request.resolver_match.url_name == 'medecin_consultations' %}active{% endif %}">
            <i class="fa-solid fa-stethoscope"></i>
            Mes Consultations
        </a>
        <a href="{% url 'mes_patients' %}" class="nav-item {% if request.resolver_match.url_name == 'mes_patients' or request.resolver_match.url_name == 'fiche_patient' %}active{% endif %}">
            <i class="fa-solid fa-users"></i>
            Mes Patients
        </a>
    </nav>
    <div class="sidebar-bottom">
        <a href="{% url 'logout' %}" class="btn-logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            Se Déconnecter
        </a>
    </div>
</div>

<div class="main-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <header class="header">
        <button class="sidebar-toggle" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Chercher un patient..." id="global-search"
                oninput="handleGlobalSearch(this.value)"
                onkeydown="if(event.key==='Enter'){window.location.href='/medecin/mes-patients/?q='+this.value}">
        </div>
    </header>

    <main class="page-content">
        {% if messages %}
        <div class="django-messages">
            {% for message in messages %}
            <div class="django-message {{ message.tags }}">
                <i class="fa-solid {% if message.tags == 'success' %}fa-circle-check{% elif message.tags == 'error' %}fa-circle-xmark{% else %}fa-triangle-exclamation{% endif %}"></i>
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</div>

<div class="alert-urgent" id="alertUrgent">
    <i class="fa-solid fa-triangle-exclamation fa-lg"></i>
    <div>
        <div style="font-size:0.8rem;opacity:0.85;">ALERTE MÉDECIN</div>
        <div id="alertPatientNom">Patient</div>
    </div>
    <button onclick="document.getElementById('alertUrgent').style.display='none'"
        style="background:none;border:none;color:white;cursor:pointer;margin-left:auto;font-size:1.2rem;">
        <i class="fa-solid fa-xmark"></i>
    </button>
</div>

<script>
function handleGlobalSearch(q) {
    // Si on est déjà sur mes-patients, filtrer en direct
    var cards = document.querySelectorAll('.patient-card');
    if (cards.length > 0) {
        q = q.toLowerCase();
        var found = 0;
        cards.forEach(function(c) {
            var match = c.dataset.name.toLowerCase().includes(q);
            c.style.display = match ? 'block' : 'none';
            if (match) found++;
        });
        var empty = document.getElementById('no-results');
        if (empty) empty.style.display = found === 0 ? 'block' : 'none';
        return;
    }
    // Sinon rediriger vers mes-patients après 400ms de pause
    clearTimeout(window._searchTimer);
    if (q.length >= 2) {
        window._searchTimer = setTimeout(function() {
            window.location.href = '/medecin/mes-patients/?q=' + encodeURIComponent(q);
        }, 400);
    }
}

function showToast(message, type) {
    var colors = { success: '#43a047', error: '#e53935', warning: '#fb8c00', info: '#1976d2' };
    var icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation', info: 'fa-circle-info' };
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.borderLeftColor = colors[type] || colors.info;
    toast.innerHTML = '<i class="fa-solid ' + (icons[type] || icons.info) + '" style="color:' + (colors[type] || colors.info) + '"></i>' + message;
    document.body.appendChild(toast);
    setTimeout(function() {
        toast.style.animation = 'slideInRight 0.3s ease reverse';
        setTimeout(function() { toast.remove(); }, 300);
    }, 3000);
}
</script>

<script>
function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('active');
}
// Fermer sidebar au clic sur un lien (mobile)
document.querySelectorAll('.nav-item').forEach(function(item) {
    item.addEventListener('click', function() {
        if (window.innerWidth <= 1024) {
            document.querySelector('.sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
    });
});
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
